<script>
function gideon( o ) {
    const iob =( o )=> ( o instanceof Object   );
    const ias =( o )=> ( "string" === typeof o );
    if ( iob( o ) ) {
        if ( gad( o ) ) {
            return ( o );
        }
    } else if ( ias( o ) ) {
        return ( gid( o ) );
    }
}
</script>

<script>
gideon . now = function( o ) {
    const now =()=> ( Date.now() );
    o = gideon( o );
    o . setAttribute( "epoch", now().toString() );
};
</script>

<script>
gideon . epoch = function( o ) {
    o = gideon( o );
    return ( o . getAttribute( "epoch" ) );
};
</script>

<script>
gideon . read = function( o ) {
    const ge = gideon( o );
    if ( ge ) {
        let value;
        switch ( ge.nodeName ) {
        case "INPUT" : case "TEXTAREA" :
            value = ( ge.value );
            break;
        case "PRE" : case "CODE" : case "VAR" :
            value = ( ge.innerText );
            break;
        default :
            value = ( ge.innerHTML );
            break;
        }
        return String( value );
    }
    say( `Expected a Gadget ID or Reference` );
};
</script>

<script>
gideon . write = function( o, value ) {
    const ge = gideon( o );
    if ( ge ) {
        value = String( value );
        switch ( ge.nodeName ) {
        case "INPUT" : case "TEXTAREA" :
            ge.value = ( value );
            return;
        case "PRE" : case "CODE" : case "VAR" :
            ge.innerText = ( value );
            return;
        default :
            ge.innerHTML = ( value );
            return;
        }
    }
    say( `Expected a Gadget ID or Reference` );
};
</script>

<script>
function separator(
  sep    = "-"
, opener = "|"
, closer = "|"
, width  = 64
) {
    const o = str( opener );
    const c = str( closer );
    const s = ( str( sep ) || "-" );
    const n = width - ( o.length + c.length );
    let t = ( s ).repeat( n / sep.length  );
    if ( t . length < n ) {
        const u = sep.charAt( 0 );
        const w = ( n - t . length );
        t += ( ( u ).repeat( w ) );
    }
    return ( `${o}${t}${c}` );
};
</script>

<script>

        m . forEach( add );

};

<script>
jarvis . assist = function() {
    const lines = qlp( jarvis.details );
    const records = lines.map(
        ( s ) => qlp( s, "|" )
    );

<script>
jarvis . hints = function( o, title ) {
    const t = str( title || "Members" );
    const m = mem( o || jarvis );
    m . unshift( `〖 ${t} 〗` );
    window . alert( qlc( m ) );
};
</script>

<script>
jarvis . inspect = function( o, title ) {
    const t = ( str( title ) || "Table" );
    const m = jarvis . inspect . prep( o || jarvis );
    const c = console;
    c . clear();
    c . group( t );
    c . table( m );
    c . groupEnd();
};
</script>

<script>
jarvis . inspect . prep = function( o ) {
    const iar =( o )=> ( Array.isArray( o ) );
    const iob =( o )=> ( o instanceof Object );
    if ( iob( o ) ) {
        if ( iar( o ) ) {
            function pure( o ) {
                if (! iar( o ) ) {
                    return;
                }
                return (
                    ( o )
                    . map( str )
                );
            }
            if ( iar( o[ 0 ] ) ) {
                return ( o ).map( pure ).filter( nop );
            } else {
                return pure( o ).filter( nop );
            }
        }
        return [ mem( o ) ];
    }
    return [ String( o ).trim() ];
};
</script>
