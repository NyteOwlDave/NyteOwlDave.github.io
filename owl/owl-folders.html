<script>
function lanhost( k ) {
    return [
      "http://dave-"
    , "/app/morpheus/owl"
    ] . join( k );
}
</script>

<script>
( lanhost )
. match = function( s, rex="dave\-.+" ) {
    s = str( s );
    const r = new RegExp( rex );
    return ( r . test( s ) );
}
</script>

<script>
( lanhost )
. shorten = function( s ) {
    const ops = ( lanhost );
    s = str( s );
    if ( ops . match( s ) ) {
        return ( s ).slice( 5 );
    }
    return ( s );
}
</script>

<script>
function init_providers() {
  const m = ( providers$ );
  const txt =( ce )=> str( ce . textContent );
  const key =( ce )=> txt( ce ).toLowerCase();
  opt_omega   . value = m[ key( opt_omega    ) ];
  opt_tower   . value = m[ key( opt_tower    ) ];
  opt_legacy  . value = m[ key( opt_legacy   ) ];
  opt_lenovo  . value = m[ key( opt_lenovo   ) ];
  opt_probook . value = m[ key( opt_probook  ) ];
  opt_pi      . value = m[ key( opt_pi       ) ];
  opt_jefr    . value = m[ key( opt_jefr     ) ];
  opt_ryzen   . value = m[ key( opt_ryzen    ) ];
  opt_morpheus. value = m[ key( opt_morpheus ) ];
  say( "Intialized Providers" );
};
</script>

<script>
function address() {
    tips( address );
}
</script>

<script>
( address )
. read = function() {
    const ops = ( address );
    return ( ops . write( "" ) );
}
</script>

<script>
( address )
. write = function( url ) {
    const ge = ( owl_address );
    const u1 = str( url );
    const u2 = str( ge . value );
    return ( ge.value = ( u1 || u2 ) );
}
</script>

<script>
( address )
. refresh = function() {
    const ops = ( address );
    const cancel =()=> {
        say( "Canceled" );
    }
    const accept =( url )=> {
        say( ops . write( url ) );
    }
    let p = ( provider_droplist.value );
    if ( "." === p ) {
        const host = (
             ( location.hostname )
          || ( "dave-omega"      )
        );
        p = ops . prompt(
            "Provider's Host Name"
           , host
        );
        if (! p ) {
            return cancel();
        }
    }
    p = ( lanhost . shorten( p ) );
    p = providers$[ p ];
    if (! p ) {
        cancel();
        expected( "Known Host Name" );
        return;
    };
    let k = ( folder_droplist.value );
    if ( "." === k ) {
        k = ops . prompt(
            "Owl Folder Name"
           , ( k )
        );
        if (! k ) {
            return cancel();
        }
    }
    const url = ( [ p, k ].join( "/" ) );
    return accept( url );
}
</script>

<script>
( address )
. visit = function( url ) {
    url = str( url );
    if (! url ) { url = "./"; }
    say( `Visit : ${url}` );
    const msg = [
      ( "Visit Address?" )
    , ( url )
    ] . join( "\n\n" );
    if ( window.confirm( msg ) ) {
        window . visit( url );
    } else {
        say( `Canceled` );
    }
}
</script>

<script>
( address )
. prompt = function( msg, orelse ) {
    return str(
        window . prompt( msg, orelse )
    );
}
</script>

<script>
( address )
. init = function() {
    const k = ( location . hostname || "omega" );
    const url = providers$[ k ];
    address . write( url );
}
</script>
